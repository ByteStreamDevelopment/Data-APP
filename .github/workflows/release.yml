name: Release

# Manuell starten (Actions → Release → Run workflow): baut die APK, legt den Tag vX.Y.Z an
# und veröffentlicht ein Release mit der APK als Anhang.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 1.0.0"
        required: true
      notes:
        description: "Text für die Release-Notizen (optional)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Version prüfen
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: $VERSION (erwartet z. B. 1.0.0)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Feste Signatur, falls die Secrets gesetzt sind (siehe README). Ohne sie signiert Gradle mit einem
      # Debug-Schlüssel, der bei jedem Lauf neu entsteht – solche APKs lassen sich nicht übereinander aktualisieren.
      - name: Signatur einrichten
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests & APK bauen
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}"
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED: ${{ steps.signing.outputs.fixed }}
        run: |
          APK="data-app-v$VERSION.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          {
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi
            echo "Voraussetzungen: Android 10 oder neuer, Bluetooth LE. Die App muss auf beiden Handys installiert sein."
            if [ "$FIXED" != "true" ]; then
              echo
              echo "Hinweis: Diese APK ist mit einem einmaligen Schlüssel signiert. Für ein Update auf eine spätere Version muss sie vorher deinstalliert werden."
            fi
          } > notes.md
          gh release create "v$VERSION" "$APK" --target "$GITHUB_SHA" --title "Data-App $VERSION" --notes-file notes.md
